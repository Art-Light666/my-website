<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页</title>
<meta name="description" content="个人主页">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>M</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
  <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  </svg>
  <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  </svg>
</button>

<main id="app">
  <!-- 由 assets/js/main.js 根据 content.js 渲染 -->
</main>

<!--
  说明：给 JS 加时间戳加载，强制浏览器每次都取最新版本。
  这是为了绕开 Cloudflare Pages 对 .js 文件的 4 小时缓存。
  这样你改完 content.js 提交，刷新页面立刻就能看到，不需要强刷。
-->
<script>
(function () {
  var v = Date.now();
  function load(src, done) {
    var s = document.createElement("script");
    s.src = src + "?v=" + v;
    s.onload = done;
    s.onerror = function () { console.error("加载失败:", src); };
    document.head.appendChild(s);
  }
  load("assets/js/content.js", function () {
    load("assets/js/main.js", null);
  });
})();
</script>

</body>
</html>
