<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写文章 · 后台</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #f6f7fb; --surface: #fff; --border: #e3e5ee; --text: #1b1c22;
    --muted: #71748a; --accent: #4f6ef7; --accent-soft: #eef1fe;
    --danger: #e5484d; --ok: #2f9e44;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c; --surface: #1b1e26; --border: #2b2f3a; --text: #e8eaf0;
      --muted: #8b90a3; --accent: #7d95ff; --accent-soft: #202436;
      --danger: #ff6b6b; --ok: #51cf66;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  a { color: var(--accent); }
  header {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
    gap: 12px; padding: 12px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; }
  header .spacer { flex: 1; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab {
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); cursor: pointer; font-size: 14px;
    font-family: inherit;
  }
  .tab.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .panel { display: none; }
  .panel.is-active { display: block; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; margin-bottom: 16px;
  }
  label { display: block; margin-bottom: 12px; }
  .lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 5px; letter-spacing: .03em; }
  input[type=text], input[type=date], input[type=password], select, textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--bg); color: var(--text); font-size: 14.5px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 14px; }
  .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 900px) { .editor-grid { grid-template-columns: 1fr; } }
  #body { min-height: 380px; font-family: var(--mono); font-size: 13.5px; line-height: 1.75; }
  .preview {
    border: 1px solid var(--border); border-radius: 9px; padding: 16px;
    min-height: 380px; max-height: 640px; overflow: auto; background: var(--bg);
    font-size: 14.5px;
  }
  .preview h1, .preview h2, .preview h3 { margin: 1.2em 0 .5em; line-height: 1.4; }
  .preview h1 { font-size: 1.5em; } .preview h2 { font-size: 1.25em; } .preview h3 { font-size: 1.08em; }
  .preview p { margin: 0 0 .9em; }
  .preview pre { background: #1e2230; color: #e8eaf0; padding: 12px; border-radius: 8px; overflow: auto; }
  .preview code { font-family: var(--mono); font-size: .9em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
  .preview pre code { background: none; padding: 0; }
  .preview blockquote { margin: 1em 0; padding-left: 14px; border-left: 3px solid var(--accent); color: var(--muted); }
  .preview img { max-width: 100%; border-radius: 8px; }
  .preview ul, .preview ol { padding-left: 1.4em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button.btn {
    padding: 9px 18px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; font-size: 14.5px;
    font-family: inherit; font-weight: 500;
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { color: #fff; filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .status { font-size: 13px; color: var(--muted); }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--ok); }
  .post-item {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
    background: var(--surface); cursor: pointer;
  }
  .post-item:hover { border-color: var(--accent); }
  .post-item .name { font-weight: 600; font-size: 14.5px; font-family: var(--mono); }
  .post-item .meta { font-size: 12.5px; color: var(--muted); }
  .post-item .grow { flex: 1; min-width: 0; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 11.5px; }
  .warn {
    padding: 10px 14px; border-radius: 9px; background: #fff4e6; color: #a35c00;
    font-size: 13px; margin-bottom: 14px; border: 1px solid #ffd8a8;
  }
  @media (prefers-color-scheme: dark) { .warn { background: #2e2415; color: #f0b96b; border-color: #4a3a1d; } }
</style>
</head>
<body>

<header>
  <h1>写文章 · 后台</h1>
  <span class="spacer"></span>
  <span class="status" id="headStatus"></span>
  <button class="btn" id="btnSettings">设置</button>
  <a class="btn" href="/" style="text-decoration:none;display:inline-flex;align-items:center">回网站</a>
</header>

<div class="wrap">

  <!-- 设置 -->
  <div class="card panel" id="panelSettings">
    <div class="warn">
      这里的 Token 只保存在你自己这台设备的浏览器里，不会上传到任何地方。
      在公用电脑上用完记得点「清除」。
    </div>
    <label>
      <span class="lbl">GitHub 仓库（用户名/仓库名）</span>
      <input type="text" id="cfgRepo" placeholder="Art-Light666/my-blog">
    </label>
    <label>
      <span class="lbl">分支</span>
      <input type="text" id="cfgBranch" placeholder="main">
    </label>
    <label>
      <span class="lbl">Personal Access Token</span>
      <input type="password" id="cfgToken" placeholder="github_pat_...">
      <p class="hint">
        还没创建？GitHub → Settings → Developer settings → Personal access tokens →
        Fine-grained tokens → Generate new token。<br>
        仓库访问选 <b>Only select repositories</b> 只勾这个博客仓库，
        权限里把 <b>Contents</b> 设为 <b>Read and write</b>，其他都不用给。
      </p>
    </label>
    <div class="row">
      <button class="btn primary" id="btnSaveCfg">保存</button>
      <button class="btn" id="btnTest">测试连接</button>
      <button class="btn" id="btnClear">清除</button>
      <span class="status" id="cfgStatus"></span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab is-active" data-tab="new">写新的</button>
    <button class="tab" data-tab="list">已有文章</button>
  </div>

  <!-- 编辑器 -->
  <div class="panel is-active" id="panelNew">
    <div class="card">
      <div class="grid">
        <label><span class="lbl">标题</span><input type="text" id="fTitle" placeholder="今天想写点什么"></label>
        <label><span class="lbl">日期</span><input type="date" id="fDate"></label>
        <label><span class="lbl">分类</span><input type="text" id="fCategory" placeholder="随笔"></label>
        <label><span class="lbl">标签（逗号隔开）</span><input type="text" id="fTags" placeholder="日常, 折腾"></label>
      </div>
      <label><span class="lbl">摘要（卡片上显示的一句话）</span><input type="text" id="fDesc" placeholder="留空就用正文开头"></label>
      <div class="grid">
        <label>
          <span class="lbl">文件名</span>
          <input type="text" id="fSlug" placeholder="my-post">
          <p class="hint">只用英文字母、数字、短横线。网址会是 /posts/文件名/</p>
        </label>
        <label>
          <span class="lbl">状态</span>
          <select id="fDraft">
            <option value="false">发布</option>
            <option value="true">存草稿（不显示在网站上）</option>
          </select>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <button class="btn" data-ins="**|**|粗体">加粗</button>
        <button class="btn" data-ins="## | |小标题">标题</button>
        <button class="btn" data-ins="[|](https://)|链接文字">链接</button>
        <button class="btn" data-ins="```\n| \n```|code">代码块</button>
        <button class="btn" data-ins="> | |引用">引用</button>
        <button class="btn" data-ins="- | |条目">列表</button>
        <span class="spacer" style="flex:1"></span>
        <span class="hint" style="margin:0">回车 = 换行，空一行 = 新段落</span>
        <label class="btn" style="margin:0;cursor:pointer">
          插入图片
          <input type="file" id="fileImage" accept="image/*" style="display:none">
        </label>
      </div>
      <div class="editor-grid">
        <textarea id="body" placeholder="# 小标题&#10;&#10;正文……"></textarea>
        <div class="preview" id="preview"></div>
      </div>
    </div>

    <div class="row">
      <button class="btn primary" id="btnPublish">发布</button>
      <button class="btn" id="btnReset">清空</button>
      <span class="status" id="status"></span>
    </div>
    <p class="hint" id="afterPublish"></p>
  </div>

  <!-- 列表 -->
  <div class="panel" id="panelList">
    <div class="row" style="margin-bottom:14px">
      <button class="btn" id="btnReload">刷新列表</button>
      <span class="status" id="listStatus"></span>
    </div>
    <div id="postList"></div>
  </div>

</div>

<script>
(function () {
  "use strict";

  var LS_KEY = "fuwari-admin-cfg-v1";
  var API = "https://api.github.com";

  var cfg = { repo: "Art-Light666/my-blog", branch: "main", token: "" };
  var current = { path: "", sha: "" };

  function $(id) { return document.getElementById(id); }

  /* ---------------- 配置 ---------------- */
  function loadCfg() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) cfg = Object.assign(cfg, JSON.parse(raw));
    } catch (e) {}
    $("cfgRepo").value = cfg.repo || "";
    $("cfgBranch").value = cfg.branch || "main";
    $("cfgToken").value = cfg.token || "";
  }

  function saveCfg() {
    cfg.repo = $("cfgRepo").value.trim();
    cfg.branch = $("cfgBranch").value.trim() || "main";
    cfg.token = $("cfgToken").value.trim();
    try { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); } catch (e) {}
    setStatus("cfgStatus", "已保存", "ok");
    updateHead();
  }

  function updateHead() {
    var ready = cfg.repo && cfg.token;
    $("headStatus").textContent = ready ? cfg.repo : "未配置";
    $("headStatus").className = "status " + (ready ? "ok" : "err");
  }

  function setStatus(id, text, kind) {
    var el = $(id);
    el.textContent = text || "";
    el.className = "status" + (kind ? " " + kind : "");
  }

  /* ---------------- GitHub API ---------------- */
  function api(path, opts) {
    opts = opts || {};
    var headers = {
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
    if (cfg.token) headers.Authorization = "Bearer " + cfg.token;
    return fetch(API + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.text().then(function (t) {
        var data = null;
        try { data = t ? JSON.parse(t) : null; } catch (e) {}
        if (!res.ok) {
          var msg = (data && data.message) || res.status + " " + res.statusText;
          if (res.status === 401) msg = "Token 无效或已过期（" + msg + "）";
          if (res.status === 404) msg = "找不到仓库或路径，检查一下仓库名/分支/Token 权限（" + msg + "）";
          if (res.status === 403) msg = "没有权限或触发限流（" + msg + "）";
          throw new Error(msg);
        }
        return data;
      });
    });
  }

  function b64encodeUtf8(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function b64decodeUtf8(b64) {
    var bin = atob(String(b64).replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  /* ---------------- Markdown ---------------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function inline(text) {
    var codes = [];
    var s = esc(text);
    s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return "\u0001" + (codes.length - 1) + "\u0001"; });
    s = s.replace(/!\[([^\]]*)\]\(\s*([^)\s]*)\s*\)/g, function (_, alt, src) {
      return '<img src="' + src + '" alt="' + alt + '" loading="lazy">';
    });
    s = s.replace(/\[([^\]]+)\]\(\s*([^)\s]*)\s*\)/g, function (_, label, href) {
      var ext = /^https?:\/\//i.test(href);
      return '<a href="' + href + '"' + (ext ? ' target="_blank" rel="noopener noreferrer"' : "") + ">" + label + "</a>";
    });
    s = s.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/~~([\s\S]+?)~~/g, "<del>$1</del>");
    s = s.replace(/\u0001(\d+)\u0001/g, function (_, i) { return "<code>" + codes[+i] + "</code>"; });
    return s;
  }

  function md(src) {
    if (!src) return '<p style="color:var(--muted)">左边写点东西，这里会实时预览。</p>';
    var lines = String(src).replace(/\r\n?/g, "\n").split("\n");
    var out = [], i = 0;
    var RE_H = /^(#{1,6})\s+(.*)$/, RE_F = /^\s*```\s*([\w+#.-]*)\s*$/, RE_Q = /^\s*>/, RE_L = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/, RE_HR = /^\s*([-*_])(?:\s*\1){2,}\s*$/;

    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }

      var f = line.match(RE_F);
      if (f) {
        var buf = []; i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
        continue;
      }

      var h = line.match(RE_H);
      if (h) { var lv = h[1].length; out.push("<h" + lv + ">" + inline(h[2]) + "</h" + lv + ">"); i++; continue; }

      if (RE_HR.test(line)) { out.push("<hr>"); i++; continue; }

      if (RE_Q.test(line)) {
        var q = [];
        while (i < lines.length && RE_Q.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        out.push("<blockquote>" + md(q.join("\n")) + "</blockquote>");
        continue;
      }

      var lm = line.match(RE_L);
      if (lm) {
        var ordered = /\d/.test(lm[2]), items = [];
        while (i < lines.length) {
          var m = lines[i].match(RE_L);
          if (m && /\d/.test(m[2]) === ordered) { items.push(m[3]); i++; continue; }
          if (items.length && /^\s{2,}\S/.test(lines[i]) && !RE_L.test(lines[i])) {
            items[items.length - 1] += "\n" + lines[i].trim(); i++; continue;
          }
          break;
        }
        var tag = ordered ? "ol" : "ul";
        out.push("<" + tag + ">" + items.map(function (t) {
          return "<li>" + inline(t).replace(/\n/g, "<br>") + "</li>";
        }).join("") + "</" + tag + ">");
        continue;
      }

      var para = [];
      while (i < lines.length && lines[i].trim() && !RE_H.test(lines[i]) && !RE_F.test(lines[i]) &&
             !RE_Q.test(lines[i]) && !RE_L.test(lines[i]) && !RE_HR.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      if (para.length) out.push("<p>" + inline(para.join("\n")).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("\n");
  }

  /* ---------------- 编辑器 ---------------- */
  function today() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  var previewTimer = null;
  function renderPreview() {
    $("preview").innerHTML = md($("body").value);
  }

  function onBodyInput() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(renderPreview, 150);
  }

  function insertSnippet(tpl) {
    var ta = $("body");
    var parts = tpl.split("|");
    var before = parts[0], after = parts[1], ph = parts[2] || "";
    var start = ta.selectionStart, end = ta.selectionEnd;
    var sel = ta.value.slice(start, end) || ph;
    ta.value = ta.value.slice(0, start) + before + sel + after + ta.value.slice(end);
    ta.focus();
    var pos = start + before.length + sel.length;
    ta.setSelectionRange(pos, pos);
    onBodyInput();
  }

  /* ---------------- 发布 ---------------- */
  function buildFrontmatter(title, date, tags, category, draft, description) {
    var fm = ["---", "title: " + JSON.stringify(title), "published: " + date];
    if (description) fm.push("description: " + JSON.stringify(description));
    fm.push("tags: [" + tags.map(function (t) { return JSON.stringify(t); }).join(", ") + "]");
    if (category) fm.push("category: " + JSON.stringify(category));
    fm.push("draft: " + (draft ? "true" : "false"));
    fm.push("---", "");
    return fm.join("\n");
  }

  function publish() {
    var title = $("fTitle").value.trim();
    var date = $("fDate").value || today();
    var category = $("fCategory").value.trim();
    var tags = $("fTags").value.split(/[,，、\s]+/).filter(Boolean);
    var draft = $("fDraft").value === "true";
    var slug = $("fSlug").value.trim() || ("post-" + date.replace(/-/g, ""));
    var description = $("fDesc").value.trim();
var bodyText = $("body").value
      .split("\n")
      .map(function (line) { return line.replace(/[ \t]+$/, ""); })
      .join("\n")
      .replace(/\s+$/, "");

    if (!cfg.repo || !cfg.token) { setStatus("status", "先去右上角「设置」填仓库和 Token", "err"); return; }
    if (!title) { $("fTitle").focus(); setStatus("status", "标题不能为空", "err"); return; }
    if (!bodyText.trim()) { $("body").focus(); setStatus("status", "正文不能为空", "err"); return; }

    slug = slug.replace(/[^A-Za-z0-9\-_]/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "") || ("post-" + date.replace(/-/g, ""));

    var path = "src/content/posts/" + slug + ".md";
    var content = buildFrontmatter(title, date, tags, category, draft, description) + bodyText + "\n";

    $("btnPublish").disabled = true;
    setStatus("status", "正在提交…");
    $("afterPublish").innerHTML = "";

    var url = "/repos/" + cfg.repo + "/contents/" + path;

    // 先看文件是否已存在（存在就要带 sha 覆盖）
    api(url + "?ref=" + encodeURIComponent(cfg.branch))
      .then(function (existing) { return existing && existing.sha; })
      .catch(function () { return null; })
      .then(function (sha) {
        var body = {
          message: (sha ? "update: " : "post: ") + title,
          content: b64encodeUtf8(content),
          branch: cfg.branch
        };
        if (sha) body.sha = sha;
        return api(url, { method: "PUT", body: body });
      })
      .then(function (res) {
        var postUrl = "/posts/" + slug + "/";
        setStatus("status", "已提交，1~2 分钟后上线", "ok");
        $("afterPublish").innerHTML =
          'Cloudflare 部署完就能看：<a href="' + postUrl + '" target="_blank">' + postUrl + "</a>";
        current = { path: path, sha: (res && res.content && res.content.sha) || "" };
      })
      .catch(function (e) {
        setStatus("status", "失败：" + e.message, "err");
      })
      .then(function () {
        $("btnPublish").disabled = false;
      });
  }

  /* ---------------- 列表 ---------------- */
  function loadList() {
    if (!cfg.repo) { setStatus("listStatus", "先去设置里填仓库", "err"); return; }
    setStatus("listStatus", "加载中…");
    api("/repos/" + cfg.repo + "/contents/src/content/posts?ref=" + encodeURIComponent(cfg.branch))
      .then(function (items) {
        var list = (items || []).filter(function (it) { return it.type === "file" && /\.md$/.test(it.name); });
        var box = $("postList");
        box.innerHTML = "";
        if (!list.length) { box.innerHTML = '<p class="hint">还没有文章。</p>'; }
        list.forEach(function (it) {
          var row = document.createElement("div");
          row.className = "post-item";
          row.innerHTML = '<div class="grow"><div class="name">' + it.name + '</div>' +
            '<div class="meta">' + Math.round(it.size / 1024 * 10) / 10 + ' KB</div></div>' +
            '<span class="tag">打开编辑</span>';
          row.onclick = function () { openPost(it.path, it.name); };
          box.appendChild(row);
        });
        setStatus("listStatus", "共 " + list.length + " 篇");
      })
      .catch(function (e) { setStatus("listStatus", "加载失败：" + e.message, "err"); });
  }

  function parseFrontmatter(text) {
    var m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
    if (!m) return { data: {}, body: text };
    var data = {};
    m[1].split(/\r?\n/).forEach(function (line) {
      var i = line.indexOf(":");
      if (i < 0) return;
      var k = line.slice(0, i).trim();
      var v = line.slice(i + 1).trim();
      if (/^".*"$/.test(v)) { try { v = JSON.parse(v); } catch (e) { v = v.slice(1, -1); } }
      else if (/^'.*'$/.test(v)) { v = v.slice(1, -1); }
      else if (/^\[.*\]$/.test(v)) {
        try { v = JSON.parse(v); } catch (e) { v = v.slice(1, -1).split(",").map(function (s) { return s.trim().replace(/^["']|["']$/g, ""); }).filter(Boolean); }
      }
      data[k] = v;
    });
    return { data: data, body: text.slice(m[0].length) };
  }

  function openPost(path, name) {
    setStatus("listStatus", "读取中…");
    api("/repos/" + cfg.repo + "/contents/" + path + "?ref=" + encodeURIComponent(cfg.branch))
      .then(function (file) {
        var text = b64decodeUtf8(file.content);
        var parsed = parseFrontmatter(text);
        var d = parsed.data;

        $("fTitle").value = d.title || "";
        $("fDate").value = d.published ? String(d.published).slice(0, 10) : today();
        $("fCategory").value = d.category || "";
        $("fTags").value = Array.isArray(d.tags) ? d.tags.join(", ") : (d.tags || "");
        $("fDesc").value = d.description || "";
        $("fSlug").value = name.replace(/\.md$/, "");
        $("fDraft").value = String(d.draft === true || d.draft === "true");
        $("body").value = parsed.body.replace(/^\s*\n/, "");
        current = { path: path, sha: file.sha };

        renderPreview();
        switchTab("new");
        setStatus("status", "正在编辑：" + name, "");
        window.scrollTo({ top: 0, behavior: "smooth" });
      })
      .catch(function (e) { setStatus("listStatus", "读取失败：" + e.message, "err"); });
  }

  /* ---------------- 图片上传 ---------------- */
  function uploadImage(file) {
    if (!file) return;
    if (!cfg.repo || !cfg.token) { setStatus("status", "先去设置里填仓库和 Token", "err"); return; }
    if (file.size > 3 * 1024 * 1024) { setStatus("status", "图片太大了，建议压缩到 3MB 以内", "err"); return; }

    var ext = (file.name.split(".").pop() || "png").toLowerCase();
    var name = "uploads/" + Date.now() + "." + ext;
    setStatus("status", "上传图片中…");

    var reader = new FileReader();
    reader.onload = function () {
      var b64 = String(reader.result).split(",")[1];
      api("/repos/" + cfg.repo + "/contents/public/" + name, {
        method: "PUT",
        body: { message: "upload: " + file.name, content: b64, branch: cfg.branch }
      }).then(function () {
        var ta = $("body");
        var snippet = "![" + file.name.replace(/\.[^.]+$/, "") + "](/" + name + ")";
        var start = ta.selectionStart;
        ta.value = ta.value.slice(0, start) + snippet + ta.value.slice(start);
        renderPreview();
        setStatus("status", "图片已上传：/" + name, "ok");
      }).catch(function (e) {
        setStatus("status", "上传失败：" + e.message, "err");
      });
    };
    reader.readAsDataURL(file);
  }

  /* ---------------- 交互 ---------------- */
  function switchTab(name) {
    document.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("is-active", t.dataset.tab === name);
    });
    $("panelNew").classList.toggle("is-active", name === "new");
    $("panelList").classList.toggle("is-active", name === "list");
    $("panelSettings").classList.remove("is-active");
    if (name === "list") loadList();
  }

  document.querySelectorAll(".tab").forEach(function (t) {
    t.onclick = function () { switchTab(t.dataset.tab); };
  });

  $("btnSettings").onclick = function () {
    $("panelSettings").classList.toggle("is-active");
  };
  $("btnSaveCfg").onclick = saveCfg;
  $("btnClear").onclick = function () {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    cfg = { repo: "Art-Light666/my-blog", branch: "main", token: "" };
    loadCfg();
    setStatus("cfgStatus", "已清除", "");
    updateHead();
  };
  $("btnTest").onclick = function () {
    saveCfg();
    setStatus("cfgStatus", "测试中…");
    api("/repos/" + cfg.repo)
      .then(function (r) {
        setStatus("cfgStatus", "连接正常：" + r.full_name + "（分支 " + cfg.branch + "）", "ok");
      })
      .catch(function (e) { setStatus("cfgStatus", "连接失败：" + e.message, "err"); });
  };

  $("btnPublish").onclick = publish;
  $("btnReload").onclick = loadList;
  $("btnReset").onclick = function () {
    if (!confirm("清空当前编辑的内容？")) return;
    ["fTitle", "fCategory", "fTags", "fDesc", "fSlug", "body"].forEach(function (id) { $(id).value = ""; });
    $("fDate").value = today();
    $("fDraft").value = "false";
    current = { path: "", sha: "" };
    renderPreview();
    setStatus("status", "");
  };

  $("body").addEventListener("input", onBodyInput);
  $("fTitle").addEventListener("input", function () {
    if (!$("fSlug").value) {
      var d = $("fDate").value || today();
      $("fSlug").value = "post-" + d.replace(/-/g, "");
    }
  });

  document.querySelectorAll("[data-ins]").forEach(function (b) {
    b.onclick = function () {
      insertSnippet(b.dataset.ins.replace(/\\n/g, "\n"));
    };
  });

  $("fileImage").addEventListener("change", function (e) {
    uploadImage(e.target.files && e.target.files[0]);
    e.target.value = "";
  });

  /* ---------------- 启动 ---------------- */
  loadCfg();
  updateHead();
  $("fDate").value = today();
  renderPreview();

  if (!cfg.token) {
    $("panelSettings").classList.add("is-active");
  }
})();
</script>
</body>
</html>
